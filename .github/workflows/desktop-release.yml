name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
    
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install & build client (isolated from root)
        run: |
          cd client
          bun install --frozen-lockfile || bun install
          bunx --bun vite build
          # Verify dist exists where Tauri expects it
          ls -la ../dist/client/index.html

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Get version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/desktop-v}" >> $GITHUB_OUTPUT
          else
            echo "version=$(node -p "require('./packages/desktop/src-tauri/tauri.conf.json').version")-dev" >> $GITHUB_OUTPUT
          fi

      - name: Build Tauri app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TODO(signing): the app is shipped unsigned and un-notarized. `cargo tauri build`
          # consumes these variables; add them here from repository secrets once
          # Apple Developer credentials exist:
          #   APPLE_CERTIFICATE         base64 .p12, imported into a temporary keychain
          #   APPLE_SIGNING_IDENTITY    "Developer ID Application: ..." (codesign identity)
          #   APPLE_ID                  notarization account
          #   APPLE_PASSWORD            app-specific password for APPLE_ID
          #   APPLE_TEAM_ID             notarization team
          # TODO(signing): updater artifacts (latest.json + .sig) are signed with
          #   TAURI_SIGNING_PRIVATE_KEY; tauri.conf.json `plugins.updater.pubkey` is still empty.
        run: |
          cd packages/desktop
          cargo tauri build ${{ matrix.args }}
          
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: mac-dash-desktop-${{ steps.version.outputs.version }}
          path: |
            packages/desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            packages/desktop/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    runs-on: ubuntu-latest
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/tags/desktop-v}" >> $GITHUB_OUTPUT

      # The cask must pin the checksum of the exact DMG that is published below.
      - name: Locate DMG and compute SHA-256
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          DMGS=(artifacts/**/*.dmg)
          if [[ ${#DMGS[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one DMG in artifacts/, found ${#DMGS[@]}"
            exit 1
          fi
          DMG="${DMGS[0]}"

          if command -v shasum > /dev/null; then
            SHA256="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          else
            SHA256="$(sha256sum "$DMG" | awk '{print $1}')"
          fi
          if [[ ! "$SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Could not compute SHA-256 of $DMG"
            exit 1
          fi

          # GitHub replaces spaces in release asset names with dots:
          # "Mac Dash_1.0.9_universal.dmg" is published as "Mac.Dash_1.0.9_universal.dmg".
          ASSET_NAME="$(basename "$DMG" | tr ' ' '.')"
          EXPECTED_NAME="Mac.Dash_${VERSION}_universal.dmg"
          if [[ "$ASSET_NAME" != "$EXPECTED_NAME" ]]; then
            echo "::error::DMG is named '$ASSET_NAME' but homebrew/macdash-cask.rb downloads '$EXPECTED_NAME'. Update the cask url."
            exit 1
          fi

          echo "DMG:     $DMG"
          echo "SHA-256: $SHA256"
          {
            echo "sha256=$SHA256"
            echo "asset_name=$ASSET_NAME"
            echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-v${VERSION}/${ASSET_NAME}"
          } >> "$GITHUB_OUTPUT"

      # homebrew/macdash-cask.rb is the template: only `version` and `sha256` change.
      - name: Render Homebrew cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.dmg.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p rendered
          sed -E \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            -e "s|^  sha256 .*|  sha256 \"${SHA256}\"|" \
            homebrew/macdash-cask.rb > rendered/macdash.rb
          grep -q "^  version \"${VERSION}\"$" rendered/macdash.rb
          grep -q "^  sha256 \"${SHA256}\"$" rendered/macdash.rb
          if grep -Eq '^[[:space:]]*sha256[[:space:]]+:no_check' rendered/macdash.rb; then
            echo "::error::Rendered cask still contains sha256 :no_check"
            exit 1
          fi
          cat rendered/macdash.rb

      - name: Upload rendered cask
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-cask
          path: rendered/macdash.rb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Desktop v${{ steps.version.outputs.version }}
          body: |
            # Mac Dash Desktop v${{ steps.version.outputs.version }}
            
            ## Installation
            
            ### Homebrew (recommended)
            ```bash
            brew install --cask talhaorak/tap/macdash
            ```
            
            ### Manual Install
            Download the `.dmg` file below and drag Mac Dash to your Applications folder.
            
            ## What's Changed
            See full changelog for details.
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg

      - name: Update Homebrew Cask
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          repository: talhaorak/homebrew-tap
          event-type: desktop-release
          client-payload: |
            {
              "version": "${{ steps.version.outputs.version }}",
              "dmg_url": "${{ steps.dmg.outputs.url }}",
              "sha256": "${{ steps.dmg.outputs.sha256 }}"
            }
